<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Trinayan Mahato — full-stack engineering, AI agent pipelines, infrastructure">
<title>Trinayan Mahato — backend, agent pipelines, infrastructure</title>
<defs>
  <linearGradient id="h-bg" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#080b11"/><stop offset="0.55" stop-color="#05070c"/><stop offset="1" stop-color="#03050a"/>
  </linearGradient>
  <radialGradient id="h-glow" cx="78%" cy="46%" r="48%">
    <stop offset="0" stop-color="#f0b429" stop-opacity="0.11"/>
    <stop offset="0.5" stop-color="#58c7d8" stop-opacity="0.06"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="h-amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c75b"/><stop offset="1" stop-color="#e09b25"/></linearGradient>
  <linearGradient id="h-trace" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58c7d8" stop-opacity="0"/><stop offset="0.25" stop-color="#58c7d8" stop-opacity="0.9"/>
    <stop offset="0.75" stop-color="#8fe3ef" stop-opacity="0.9"/><stop offset="1" stop-color="#58c7d8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="h-grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0 H0 V34" fill="none" stroke="#111823" stroke-width="1"/></pattern>
  <filter id="h-bloom" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="h-type"><rect x="64" y="236" width="0" height="26"><animate attributeName="width" values="0;0;556;556" keyTimes="0;0.08;0.64;1" dur="7.5s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="h-frame"><rect width="1200" height="420" rx="14"/></clipPath>
  <style>
    .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
    .sans{font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif}
    @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-34px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .caret{animation:caret 1s steps(1) infinite}
    .gridmove{animation:drift 7s linear infinite}
    .live{animation:pulse 2.4s ease-in-out infinite}
  </style>
</defs>

<g clip-path="url(#h-frame)">
  <rect width="1200" height="420" fill="url(#h-bg)"/>
  <g class="gridmove" opacity="0.85"><rect x="-40" width="1280" height="420" fill="url(#h-grid)"/></g>
  <rect width="1200" height="420" fill="url(#h-glow)"/>

  <g stroke="#243041" stroke-width="1" fill="none">
    <path d="M22 44 V22 H44"/><path d="M1156 22 H1178 V44"/>
    <path d="M22 376 V398 H44"/><path d="M1156 398 H1178 V376"/>
  </g>

  <g class="mono" font-size="11" letter-spacing="4.2">
    <rect x="64" y="72" width="22" height="2" fill="url(#h-amber)"/>
    <text x="98" y="78" fill="#f0b429">BACKEND SYSTEMS</text>
    <text x="276" y="78" fill="#3d4759">/</text>
    <text x="294" y="78" fill="#8b96a8">AI AGENT PIPELINES</text>
    <text x="500" y="78" fill="#3d4759">/</text>
    <text x="518" y="78" fill="#8b96a8">INFRASTRUCTURE</text>
  </g>

  <text x="62" y="162" class="sans" font-size="72" font-weight="700" letter-spacing="-2.2" fill="#eef2f8">Trinayan Mahato</text>
  <text x="66" y="196" class="mono" font-size="13" letter-spacing="2.6" fill="#6b7689">@TrinayanMahato</text>

  <g clip-path="url(#h-type)">
    <text x="64" y="256" class="mono" font-size="16" fill="#cfd8e4">I build systems that think, and the plumbing that keeps them up.</text>
  </g>
  <rect class="caret" x="64" y="240" width="8" height="19" fill="#f0b429">
    <animate attributeName="x" values="64;64;622;622" keyTimes="0;0.08;0.64;1" dur="7.5s" repeatCount="indefinite"/>
  </rect>

  <g class="mono" font-size="11" letter-spacing="1.6">
    <g fill="#f0b429" font-size="22" font-weight="700" letter-spacing="-0.4">
      <text x="64" y="330">8</text><text x="188" y="330">42</text><text x="312" y="330">7</text><text x="436" y="330">5</text>
    </g>
    <g fill="#67727f">
      <text x="64" y="350">SHIPPED PROJECTS</text><text x="188" y="350">API ENDPOINTS</text>
      <text x="312" y="350">AGENT NODES</text><text x="436" y="350">LANGUAGES</text>
    </g>
    <g stroke="#1b2432"><path d="M168 312 V352"/><path d="M292 312 V352"/><path d="M416 312 V352"/></g>
  </g>

  <g transform="translate(64,378)">
    <circle cx="5" cy="-4" r="3.4" fill="#58c7d8" class="live"/>
    <text x="18" y="0" class="mono" font-size="10.5" letter-spacing="2.4" fill="#5d6b7d">DESIGNED · BUILT · DEPLOYED</text>
  </g>

  <!-- ===== service topology ===== -->
  <g transform="translate(772,52)">
    <text x="194" y="8" text-anchor="middle" class="mono" font-size="10" letter-spacing="3.4" fill="#4e5a6b">TYPICAL STACK</text>

    <!-- edges -->
    <g stroke="#1e2836" stroke-width="1.2" fill="none">
      <path id="e1" d="M92 58 H176"/>
      <path id="e2" d="M224 76 V128"/>
      <path id="e3" d="M272 146 H330"/>
      <path id="e4" d="M224 164 V216"/>
      <path id="e5" d="M176 146 H118 V164"/>
    </g>

    <!-- nodes -->
    <g>
      <rect x="10" y="40" width="82" height="36" rx="7" fill="#0c1119" stroke="#243041"/>
      <text x="51" y="62" text-anchor="middle" class="mono" font-size="10.5" fill="#aab5c4">client</text>

      <rect x="176" y="40" width="96" height="36" rx="7" fill="#0c1119" stroke="#2c3b50"/>
      <text x="224" y="62" text-anchor="middle" class="mono" font-size="10.5" fill="#e8edf4">API</text>

      <rect x="168" y="128" width="112" height="36" rx="7" fill="#101a26" stroke="#4a3a12"/>
      <text x="224" y="150" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#f0b429">agent graph</text>

      <rect x="330" y="128" width="72" height="36" rx="7" fill="#0c1119" stroke="#243041"/>
      <text x="366" y="150" text-anchor="middle" class="mono" font-size="10.5" fill="#aab5c4">LLM</text>

      <rect x="60" y="164" width="98" height="36" rx="7" fill="#0c1119" stroke="#243041"/>
      <text x="109" y="186" text-anchor="middle" class="mono" font-size="10.5" fill="#aab5c4">vector db</text>

      <rect x="168" y="216" width="112" height="36" rx="7" fill="#0c1119" stroke="#2a3a4e"/>
      <text x="224" y="238" text-anchor="middle" class="mono" font-size="10.5" fill="#58c7d8">mongo · redis</text>
    </g>

    <!-- travelling packets -->
    <g fill="#f6c75b" filter="url(#h-bloom)">
      <circle r="2.8"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle r="2.8"><animateMotion dur="3.2s" begin="0.5s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle r="2.8"><animateMotion dur="3.2s" begin="1s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#58c7d8" filter="url(#h-bloom)">
      <circle r="2.8"><animateMotion dur="3.2s" begin="1.5s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle r="2.8"><animateMotion dur="3.2s" begin="2s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g transform="translate(0,406)">
    <path d="M0 0 H1200" stroke="#141c27"/>
    <path d="M0 0 Q 60 -12 120 0 T 240 0 Q 300 -20 360 0 T 480 0 Q 540 -8 600 0 T 720 0 Q 780 -16 840 0 T 960 0 Q 1020 -10 1080 0 T 1200 0"
          fill="none" stroke="url(#h-trace)" stroke-width="1.8" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;-240 0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</g>
</svg>
