<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="580" height="270" role="img" aria-label="Agentic Recruiter — Autonomous hiring pipeline that pauses for human approval">
<defs>
  <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e15"/><stop offset="1" stop-color="#05070c"/></linearGradient>
  <linearGradient id="c-am" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c75b"/><stop offset="1" stop-color="#e09b25"/></linearGradient>
  <filter id="c-b" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  @keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes rise{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  @keyframes flow{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}</style>
</defs>
<rect width="580" height="270" rx="10" fill="url(#c-bg)" stroke="#172030"/>
<rect x="0" y="0" width="580" height="3" rx="1.5" fill="url(#c-am)" opacity="0.8"/>
<text x="24" y="44" class="m" font-size="18" font-weight="700" letter-spacing="-0.2" fill="#eaf0f7">Agentic Recruiter</text>
<text x="24" y="66" class="m" font-size="10" letter-spacing="1.6" fill="#7d8899">JavaScript · LangGraph · OpenAI · ChromaDB</text>
<text x="24" y="96" class="m" font-size="11.5" fill="#97a3b4">Autonomous hiring pipeline that pauses for human approval</text>
<path d="M24 112 H556" stroke="#141b25"/>

<g transform="translate(24,130)">
  <g class="m" font-size="9.5" fill="#4e5a6b" letter-spacing="2"><text y="0">STATEFUL GRAPH · 7 NODES</text></g>
  <g stroke="#223044" fill="none"><path d="M26 22 V40"/><path d="M26 62 V80"/><path d="M26 102 V118"/></g>
  <g fill="#0e1622" stroke="#243247">
    <rect x="0" y="10" width="150" height="20" rx="4"/><rect x="0" y="50" width="150" height="20" rx="4"/>
    <rect x="0" y="90" width="150" height="20" rx="4"/>
  </g>
  <g class="m" font-size="9.5" fill="#9aa6b6"><text x="10" y="24">extract reqs</text><text x="10" y="64">embed + post</text><text x="10" y="104">shortlist</text></g>
  <rect x="190" y="30" width="150" height="60" rx="6" fill="#101a26" stroke="#4a3a12"/>
  <text x="265" y="54" text-anchor="middle" class="m" font-size="10.5" font-weight="700" fill="#f0b429">HUMAN GATE</text>
  <text x="265" y="72" text-anchor="middle" class="m" font-size="9" fill="#6b5a2a">graph interrupts here</text>
  <circle cx="190" cy="60" r="3" fill="#f6c75b" filter="url(#c-b)" style="animation:fade 2s ease-in-out infinite"/>
  <g stroke="#223044" fill="none" stroke-dasharray="4 4" style="animation:flow 1.6s linear infinite"><path d="M150 60 H186"/><path d="M340 60 H386"/></g>
  <rect x="386" y="30" width="146" height="60" rx="6" fill="#0d1620" stroke="#2a3a4e"/>
  <text x="459" y="54" text-anchor="middle" class="m" font-size="10.5" font-weight="700" fill="#58c7d8">INTERVIEWS</text>
  <text x="459" y="72" text-anchor="middle" class="m" font-size="9" fill="#5d6977">scheduled + mailed</text>
  <text x="0" y="134" class="m" font-size="9" letter-spacing="2" fill="#44505f">RESUMES RANKED BY VECTOR SIMILARITY</text>
</g>
</svg>