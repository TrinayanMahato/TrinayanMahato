<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="580" height="270" role="img" aria-label="SwapStyle — Community clothing-exchange platform — full UI, mock data">
<defs>
  <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e15"/><stop offset="1" stop-color="#05070c"/></linearGradient>
  <linearGradient id="c-am" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c75b"/><stop offset="1" stop-color="#e09b25"/></linearGradient>
  <filter id="c-b" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  @keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes rise{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  @keyframes flow{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}</style>
</defs>
<rect width="580" height="270" rx="10" fill="url(#c-bg)" stroke="#172030"/>
<rect x="0" y="0" width="580" height="3" rx="1.5" fill="url(#c-am)" opacity="0.8"/>
<text x="24" y="44" class="m" font-size="18" font-weight="700" letter-spacing="-0.2" fill="#eaf0f7">SwapStyle</text>
<text x="24" y="66" class="m" font-size="10" letter-spacing="1.6" fill="#7d8899">TypeScript · React 19 · Vite · shadcn/ui</text>
<text x="24" y="96" class="m" font-size="11.5" fill="#97a3b4">Community clothing-exchange platform — full UI, mock data</text>
<path d="M24 112 H556" stroke="#141b25"/>

<g transform="translate(24,128)">
  <g class="m" font-size="9.5" fill="#4e5a6b" letter-spacing="2"><text y="0">ROUTES</text></g>
  <g class="m" font-size="9.5">
    <g fill="#0e1622" stroke="#243247">
      <rect x="0" y="10" width="170" height="30" rx="5"/><rect x="182" y="10" width="170" height="30" rx="5"/><rect x="364" y="10" width="168" height="30" rx="5"/>
    </g>
    <g fill="#e8edf4"><text x="12" y="29">/ landing</text><text x="194" y="29">/dashboard</text><text x="376" y="29">/admin</text></g>
  </g>
  <g class="m" font-size="9" fill="#8b96a8">
    <g fill="#0b111a" stroke="#1c2534">
      <rect x="0" y="52" width="82" height="22" rx="4"/><rect x="90" y="52" width="82" height="22" rx="4"/><rect x="180" y="52" width="82" height="22" rx="4"/><rect x="270" y="52" width="82" height="22" rx="4"/>
      <rect x="0" y="80" width="82" height="22" rx="4"/><rect x="90" y="80" width="82" height="22" rx="4"/><rect x="180" y="80" width="82" height="22" rx="4"/><rect x="270" y="80" width="82" height="22" rx="4"/>
    </g>
    <text x="10" y="67">listings</text><text x="100" y="67">swap log</text><text x="190" y="67">moderation</text><text x="280" y="67">feedback</text>
    <text x="10" y="95">women</text><text x="100" y="95">men</text><text x="190" y="95">kids</text><text x="280" y="95">condition</text>
  </g>
  <rect x="0" y="52" width="82" height="22" rx="4" fill="#f0b429" opacity="0.07">
    <animate attributeName="x" values="0;90;180;270;0" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="52;80;52;80;52" dur="4.4s" repeatCount="indefinite"/></rect>
  <text x="364" y="67" class="m" font-size="9" letter-spacing="1.5" fill="#44505f">UI COMPLETE</text>
  <text x="364" y="95" class="m" font-size="9" letter-spacing="1.5" fill="#6b5a2a">BACKEND NEXT</text>
  <text x="0" y="124" class="m" font-size="9" letter-spacing="2" fill="#44505f">206 KB OF TYPESCRIPT · 50+ UI PRIMITIVES</text>
</g>
</svg>