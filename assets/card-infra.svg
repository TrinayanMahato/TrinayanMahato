<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="580" height="270" role="img" aria-label="Infrastructure — Deployment manifests and a load-balanced reverse proxy">
<defs>
  <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e15"/><stop offset="1" stop-color="#05070c"/></linearGradient>
  <linearGradient id="c-am" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c75b"/><stop offset="1" stop-color="#e09b25"/></linearGradient>
  <filter id="c-b" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  @keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes rise{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  @keyframes flow{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}</style>
</defs>
<rect width="580" height="270" rx="10" fill="url(#c-bg)" stroke="#172030"/>
<rect x="0" y="0" width="580" height="3" rx="1.5" fill="url(#c-am)" opacity="0.8"/>
<text x="24" y="44" class="m" font-size="18" font-weight="700" letter-spacing="-0.2" fill="#eaf0f7">Infrastructure</text>
<text x="24" y="66" class="m" font-size="10" letter-spacing="1.6" fill="#7d8899">Kubernetes · NGINX · Docker</text>
<text x="24" y="96" class="m" font-size="11.5" fill="#97a3b4">Deployment manifests and a load-balanced reverse proxy</text>
<path d="M24 112 H556" stroke="#141b25"/>

<g transform="translate(24,128)">
  <g class="m" font-size="9.5" fill="#4e5a6b" letter-spacing="2"><text y="0">EDGE → SERVICE → PODS</text></g>
  <rect x="0" y="12" width="96" height="44" rx="6" fill="#0e1622" stroke="#243247"/>
  <text x="48" y="32" text-anchor="middle" class="m" font-size="10" fill="#e8edf4">nginx</text>
  <text x="48" y="47" text-anchor="middle" class="m" font-size="8.5" fill="#5d6977">least_conn</text>
  <g stroke="#223044" fill="none" stroke-dasharray="4 4" style="animation:flow 1.6s linear infinite"><path d="M96 34 H146"/></g>
  <rect x="146" y="12" width="108" height="44" rx="6" fill="#101a26" stroke="#2c3b50"/>
  <text x="200" y="32" text-anchor="middle" class="m" font-size="10" fill="#e8edf4">NodePort</text>
  <text x="200" y="47" text-anchor="middle" class="m" font-size="8.5" fill="#64707f">30000 / 30005</text>
  <g stroke="#223044" fill="none"><path d="M254 34 H292 V18"/><path d="M254 34 H292 V50"/></g>
  <g fill="#0b111a" stroke="#1c2534"><rect x="292" y="6" width="112" height="24" rx="4"/><rect x="292" y="38" width="112" height="24" rx="4"/>
    <rect x="416" y="6" width="116" height="24" rx="4"/><rect x="416" y="38" width="116" height="24" rx="4"/></g>
  <g class="m" font-size="9" fill="#9aa6b6"><text x="302" y="22">frontend ×2</text><text x="302" y="54">backend ×2</text>
    <text x="426" y="22">secrets</text><text x="426" y="54">envFrom</text></g>
  <g fill="#f6c75b" filter="url(#c-b)">
    <circle cx="292" cy="18" r="2.4" style="animation:fade 2.4s ease-in-out infinite"/>
    <circle cx="292" cy="50" r="2.4" style="animation:fade 2.4s ease-in-out .8s infinite"/></g>
  <text x="0" y="90" class="m" font-size="9" letter-spacing="2" fill="#44505f">SPA FALLBACK · WEBSOCKET UPGRADE · X-FORWARDED-FOR</text>
</g>
</svg>