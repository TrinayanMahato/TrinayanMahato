<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="580" height="270" role="img" aria-label="AI-Driven SIEM — Alerts enriched with log context, then triaged by an LLM">
<defs>
  <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e15"/><stop offset="1" stop-color="#05070c"/></linearGradient>
  <linearGradient id="c-am" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c75b"/><stop offset="1" stop-color="#e09b25"/></linearGradient>
  <filter id="c-b" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  @keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes rise{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  @keyframes flow{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}</style>
</defs>
<rect width="580" height="270" rx="10" fill="url(#c-bg)" stroke="#172030"/>
<rect x="0" y="0" width="580" height="3" rx="1.5" fill="url(#c-am)" opacity="0.8"/>
<text x="24" y="44" class="m" font-size="18" font-weight="700" letter-spacing="-0.2" fill="#eaf0f7">AI-Driven SIEM</text>
<text x="24" y="66" class="m" font-size="10" letter-spacing="1.6" fill="#7d8899">Python · FastAPI · Gemini · Elasticsearch</text>
<text x="24" y="96" class="m" font-size="11.5" fill="#97a3b4">Alerts enriched with log context, then triaged by an LLM</text>
<path d="M24 112 H556" stroke="#141b25"/>

<g transform="translate(24,128)">
  <g class="m" font-size="9.5" fill="#4e5a6b" letter-spacing="2"><text y="0">ALERT → CONTEXT → VERDICT</text></g>
  <g fill="#0e1622" stroke="#243247"><rect x="0" y="10" width="112" height="46" rx="5"/></g>
  <text x="56" y="30" text-anchor="middle" class="m" font-size="9.5" fill="#9aa6b6">elastalert</text>
  <text x="56" y="46" text-anchor="middle" class="m" font-size="8.5" fill="#5d6977">webhook</text>
  <g stroke="#223044" fill="none" stroke-dasharray="4 4" style="animation:flow 1.6s linear infinite"><path d="M112 33 H158"/><path d="M270 33 H316"/></g>
  <rect x="158" y="10" width="112" height="46" rx="5" fill="#0e1622" stroke="#243247"/>
  <text x="214" y="30" text-anchor="middle" class="m" font-size="9.5" fill="#9aa6b6">enrich</text>
  <text x="214" y="46" text-anchor="middle" class="m" font-size="8.5" fill="#5d6977">surrounding logs</text>
  <rect x="316" y="10" width="112" height="46" rx="5" fill="#101a26" stroke="#4a3a12"/>
  <text x="372" y="30" text-anchor="middle" class="m" font-size="9.5" font-weight="700" fill="#f0b429">gemini</text>
  <text x="372" y="46" text-anchor="middle" class="m" font-size="8.5" fill="#6b5a2a">structured verdict</text>
  <g class="m" font-size="9">
    <rect x="0" y="72" width="168" height="22" rx="4" fill="#0d1a17" stroke="#1f3a2c"/><text x="12" y="87" fill="#6fcf97">normal</text>
    <rect x="182" y="72" width="168" height="22" rx="4" fill="#1a1508" stroke="#4a3a12"/><text x="194" y="87" fill="#f0b429">block_temporarily</text>
    <rect x="364" y="72" width="168" height="22" rx="4" fill="#1a0e10" stroke="#4a1a1e"/><text x="376" y="87" fill="#e4595f">block_permanently</text>
  </g>
  <circle cy="83" r="2.6" fill="#f6c75b" filter="url(#c-b)"><animate attributeName="cx" values="84;266;448;84" dur="4.5s" repeatCount="indefinite"/></circle>
  <text x="0" y="118" class="m" font-size="9" letter-spacing="2" fill="#44505f">SEVERE ACTIONS E-MAIL A HUMAN FOR APPROVAL</text>
</g>
</svg>