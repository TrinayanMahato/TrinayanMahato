<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="580" height="270" role="img" aria-label="PlanBetter — Live weather dashboard with OAuth and cached forecasts">
<defs>
  <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e15"/><stop offset="1" stop-color="#05070c"/></linearGradient>
  <linearGradient id="c-am" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c75b"/><stop offset="1" stop-color="#e09b25"/></linearGradient>
  <filter id="c-b" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  @keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes rise{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  @keyframes flow{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}</style>
</defs>
<rect width="580" height="270" rx="10" fill="url(#c-bg)" stroke="#172030"/>
<rect x="0" y="0" width="580" height="3" rx="1.5" fill="url(#c-am)" opacity="0.8"/>
<text x="24" y="44" class="m" font-size="18" font-weight="700" letter-spacing="-0.2" fill="#eaf0f7">PlanBetter</text>
<text x="24" y="66" class="m" font-size="10" letter-spacing="1.6" fill="#7d8899">JavaScript · Next.js · NextAuth · MongoDB</text>
<text x="24" y="96" class="m" font-size="11.5" fill="#97a3b4">Live weather dashboard with OAuth and cached forecasts</text>
<path d="M24 112 H556" stroke="#141b25"/>

<g transform="translate(24,128)">
  <g class="m" font-size="9.5" fill="#4e5a6b" letter-spacing="2"><text y="0">DEPLOYED ON VERCEL</text></g>
  <g fill="#0e1622" stroke="#243247"><rect x="0" y="10" width="126" height="52" rx="6"/></g>
  <text x="63" y="32" text-anchor="middle" class="m" font-size="18" font-weight="700" fill="#f0b429">26°</text>
  <text x="63" y="50" text-anchor="middle" class="m" font-size="8.5" fill="#5d6977">feels like 28°</text>
  <g class="m" font-size="8.5" fill="#8b96a8">
    <g fill="#0b111a" stroke="#1c2534"><rect x="138" y="10" width="78" height="24" rx="4"/><rect x="138" y="38" width="78" height="24" rx="4"/>
      <rect x="224" y="10" width="78" height="24" rx="4"/><rect x="224" y="38" width="78" height="24" rx="4"/></g>
    <text x="148" y="26">humidity</text><text x="148" y="54">wind</text><text x="234" y="26">UV index</text><text x="234" y="54">cache 1h</text>
  </g>
  <g class="m" font-size="8.5">
    <g fill="#0b111a" stroke="#1c2534"><rect x="316" y="10" width="42" height="52" rx="4"/><rect x="364" y="10" width="42" height="52" rx="4"/>
      <rect x="412" y="10" width="42" height="52" rx="4"/><rect x="460" y="10" width="42" height="52" rx="4"/><rect x="508" y="10" width="24" height="52" rx="4"/></g>
    <g fill="#6b7689"><text x="328" y="26">Mon</text><text x="376" y="26">Tue</text><text x="424" y="26">Wed</text><text x="472" y="26">Thu</text></g>
    <g fill="#58c7d8" font-size="9.5"><text x="330" y="46">31°</text><text x="378" y="46">29°</text><text x="426" y="46">33°</text><text x="474" y="46">30°</text></g>
  </g>
  <g stroke="#1f2a38" fill="none"><path d="M0 78 H532"/></g>
  <text x="0" y="98" class="m" font-size="9" letter-spacing="2" fill="#44505f">GOOGLE OAUTH · DYNAMIC WEATHER BACKGROUNDS · DARK MODE</text>
  <circle cx="520" cy="36" r="3" fill="#58c7d8" filter="url(#c-b)" style="animation:fade 2.2s ease-in-out infinite"/>
</g>
</svg>